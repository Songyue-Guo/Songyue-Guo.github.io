{% assign fq_id = include.uid | prepend: 'fqora-' %}
<figure class="paper-visual mega-visual fqora-visual" data-paper-animation="fqora" data-duration="{{ include.duration | default: 8000 | escape }}">
  <div class="mega-heading"><span class="mega-name">FQora<span class="mega-spark" aria-hidden="true">✦</span></span><span class="mega-kicker">METHOD IN MOTION</span></div>
  <svg class="mega-canvas" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 232" role="img" aria-labelledby="{{ fq_id }}-title {{ fq_id }}-desc">
    <title id="{{ fq_id }}-title">FQora balances seller and buyer utilities through quality-aware pricing</title>
    <desc id="{{ fq_id }}-desc">Sellers provide data and price anchors. Buyers submit queries with quality requirements and valuations. An arbiter prices the requested data and uses BPO to balance market utilities. Utility bars are illustrative, not measured results or a claim of equal utility.</desc>
    <defs>
      <pattern id="{{ fq_id }}-grid" width="14" height="14" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r=".65" fill="var(--mv-grid)"/></pattern>
      <marker id="{{ fq_id }}-purple" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="var(--mv-purple)" stroke-width="1.2"/></marker>
      <marker id="{{ fq_id }}-green" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="var(--mv-green)" stroke-width="1.2"/></marker>
    </defs>
    <rect width="360" height="232" fill="url(#{{ fq_id }}-grid)" opacity=".65"/>
    <text x="20" y="27" font-size="20" font-weight="700" fill="var(--mv-ink)">Value on both sides.</text>
    <text x="20" y="45" font-size="9" fill="var(--mv-muted)">Quality-aware data. Utility-aware pricing.</text>

    <g data-track="fq-seller">
      <rect x="18" y="64" width="100" height="90" rx="11" fill="var(--mv-panel)" stroke="var(--mv-purple)" stroke-opacity=".55"/>
      <circle cx="31" cy="79" r="3" fill="var(--mv-purple)"/><text x="40" y="82" font-size="10" font-weight="700" fill="var(--mv-ink)">SELLER</text>
      <rect x="30" y="99" width="44" height="29" rx="4" fill="var(--mv-purple-soft)" stroke="var(--mv-purple)" opacity=".5"/>
      <rect x="39" y="95" width="44" height="29" rx="4" fill="var(--mv-purple-soft)" stroke="var(--mv-purple)" opacity=".7"/>
      <rect x="48" y="91" width="44" height="29" rx="4" fill="var(--mv-purple-soft)" stroke="var(--mv-purple)"/>
      <path d="M55 101h29M55 107h17M55 113h23" stroke="var(--mv-purple)" stroke-width="1.3" opacity=".65"/>
      <text x="30" y="143" font-size="8" fill="var(--mv-muted)">Data + price anchors</text>
    </g>
    <g data-track="fq-buyer">
      <rect x="242" y="64" width="100" height="90" rx="11" fill="var(--mv-panel)" stroke="var(--mv-green)" stroke-opacity=".55"/>
      <circle cx="255" cy="79" r="3" fill="var(--mv-green)"/><text x="264" y="82" font-size="10" font-weight="700" fill="var(--mv-ink)">BUYER</text>
      <rect x="253" y="92" width="78" height="34" rx="5" fill="var(--mv-green-soft)"/>
      <text x="261" y="105" font-size="8" font-family="ui-monospace,monospace" fill="var(--mv-green)">SELECT data</text>
      <path d="M261 114h39" stroke="var(--mv-green)" stroke-width="2" opacity=".5"/>
      <circle cx="318" cy="114" r="5" fill="var(--mv-green)"/><path d="m315.5 114 1.7 1.7 3.2-3.5" fill="none" stroke="var(--mv-panel)" stroke-width="1.1"/>
      <text x="253" y="143" font-size="8" fill="var(--mv-muted)">Query + quality</text>
    </g>

    <path d="M118 110h31" stroke="var(--mv-purple)" stroke-width="1.3" marker-end="url(#{{ fq_id }}-purple)" opacity=".65"/>
    <path d="M242 98h-31" stroke="var(--mv-green)" stroke-width="1.3" marker-end="url(#{{ fq_id }}-green)" opacity=".65"/>
    <g data-track="fq-arbiter">
      <text x="180" y="71" text-anchor="middle" font-size="8" letter-spacing=".7" fill="var(--mv-muted)">ARBITER</text>
      <circle cx="180" cy="105" r="26" fill="var(--mv-blue-soft)" stroke="var(--mv-blue)" stroke-width="1.2"/>
      <text x="180" y="111" text-anchor="middle" font-size="24" font-weight="600" fill="var(--mv-blue)">π</text>
      <rect x="156" y="137" width="48" height="17" rx="8.5" fill="var(--mv-blue-soft)"/><text x="180" y="149" text-anchor="middle" font-size="8" font-weight="700" fill="var(--mv-blue)">BPO</text>
    </g>
    <circle class="fq-halo" data-track="fq-halo" cx="180" cy="105" r="30" fill="none" stroke="var(--mv-blue)" stroke-width="2"/>
    <circle class="fq-packet" data-track="fq-query-packet" cx="236" cy="98" r="3" fill="var(--mv-green)"/>
    <circle class="fq-packet" data-track="fq-data-packet" cx="123" cy="110" r="3" fill="var(--mv-purple)"/>

    <g>
      <rect x="18" y="168" width="156" height="34" rx="8" fill="var(--mv-purple-soft)" opacity=".8"/>
      <rect x="186" y="168" width="156" height="34" rx="8" fill="var(--mv-green-soft)" opacity=".8"/>
      <text x="28" y="181" font-size="8.5" font-weight="600" fill="var(--mv-purple)">Seller utility</text>
      <text x="196" y="181" font-size="8.5" font-weight="600" fill="var(--mv-green)">Buyer utility</text>
      <rect x="28" y="188" width="136" height="5" rx="2.5" fill="var(--mv-panel)"/>
      <rect x="196" y="188" width="136" height="5" rx="2.5" fill="var(--mv-panel)"/>
      <rect data-track="fq-seller-utility" x="28" y="188" width="98" height="5" rx="2.5" fill="var(--mv-purple)"/>
      <rect data-track="fq-buyer-utility" x="196" y="188" width="104" height="5" rx="2.5" fill="var(--mv-green)"/>
    </g>
    <g class="fq-phase" data-track="fq-phase-query"><text x="180" y="222" text-anchor="middle" font-size="9" fill="var(--mv-muted)">01 / MATCH DATA TO THE QUALITY-AWARE QUERY</text></g>
    <g class="fq-phase" data-track="fq-phase-price"><text x="180" y="222" text-anchor="middle" font-size="9" fill="var(--mv-blue)">02 / PRICE THE REQUESTED DATA</text></g>
    <g class="fq-phase" data-track="fq-phase-balance"><text x="180" y="222" text-anchor="middle" font-size="9" fill="var(--mv-purple)">03 / BPO BALANCES MARKET UTILITIES</text></g>
    <g class="fq-phase fq-phase--final" data-track="fq-phase-result"><text x="180" y="222" text-anchor="middle" font-size="9" font-weight="600" fill="var(--mv-ink)">SELLER REVENUE ↔ BUYER VALUE</text></g>
  </svg>
  <figcaption class="sr-only">FQora is a quality-aware data market designed to balance seller and buyer utilities with pricing and BPO.</figcaption>
  <div class="mega-controls"><span class="mega-caption">From quality-aware queries to balanced utilities</span><button type="button" class="mega-play" hidden aria-label="Play FQora market animation"><span class="mega-play-icon" aria-hidden="true">↻</span><span data-play-label>Replay</span></button></div>
  <div class="mega-progress" aria-hidden="true"><span data-track="progress"></span></div>
</figure>
